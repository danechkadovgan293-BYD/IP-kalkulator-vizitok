<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор визиток</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="display-4 text-center mb-5">Калькулятор визиток</h1>

        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <div class="form-floating mb-3">
                            <input type="number" id="qty" class="form-control"
                                   value="90" min="30" step="30" placeholder="Тираж">
                            <label for="qty">Тираж, шт.</label>
                        </div>

                        <div class="form-floating mb-3">
                            <select id="paper" class="form-select"></select>
                            <label for="paper">Бумага</label>
                        </div>

                        <div class="form-floating mb-3">
                            <select id="color" class="form-select"></select>
                            <label for="color">Цветность</label>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-success-subtle rounded">
                            <span class="text-uppercase small text-secondary">Итого</span>
                            <output id="price" class="display-6">0 ₽</output>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
